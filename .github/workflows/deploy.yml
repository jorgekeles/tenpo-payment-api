name: "Deploy payment-api to Cloud Run"

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

env:
  GCP_PROJECT_ID: "tenpo-payment-challenge" # Reemplazar por tu ID de proyecto real en GitHub Secrets si es necesario
  GCP_REGION: "us-central1"
  GAR_REPO: "tenpo-repo" # Nombre del repositorio de Artifact Registry
  SERVICE_NAME: "tenpo-payment-api-dev"

jobs:
  build-and-deploy:
    name: "Build & Deploy"
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Autenticación en Google Cloud mediante Service Account Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Configurar gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 4. Configurar Docker para autenticar con Artifact Registry
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 5. Build y Push de la imagen de Docker a Artifact Registry
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/payment-api:${{ github.sha }}"
          docker build -t $IMAGE_TAG ./app
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 6. Desplegar en Google Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet
