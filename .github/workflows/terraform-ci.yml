name: "Terraform CI"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
  terraform-validation:
    name: "Format, Validate and Scan Security"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # 1. Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.7"

      # 3. Check code formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # 4. Initialize working directory (necessary for validation)
      - name: Terraform Init
        run: terraform init -backend=false

      # 5. Validate configuration syntax
      - name: Terraform Validate
        run: terraform validate

      # 6. Static Security Analysis (Trivy Scan for IaC)
      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          exit-code: '1' # Fail build if high/critical issues are found
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'